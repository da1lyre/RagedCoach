services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ragedrun
      POSTGRES_PASSWORD: ragedrun
      POSTGRES_DB: ragedrun
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    build: ./ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: ./app
    volumes:
      - ./app/src:/app/src
      - ./app/static:/app/static
    environment:
      DATABASE_URL: postgresql://ragedrun:ragedrun@postgres:5432/ragedrun
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - qdrant
      - ollama
    ports:
      - "8000:8000"


volumes:
  postgres:
  qdrant:
  ollama: